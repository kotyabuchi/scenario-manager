pre-commit:
  jobs:
    - name: lint
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: npx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
      
    - name: type-check
      run: npx tsc --noEmit
      fail_text: "TypeScriptの型チェックに失敗しました"

    - name: agents-md-sync
      glob:
        - ".claude/rules/*.md"
        - ".claude/harness/agents-preamble.md"
        - "scripts/gen-agents-md.mjs"
      run: node scripts/gen-agents-md.mjs && git add AGENTS.md
      fail_text: "AGENTS.md の再生成に失敗しました"