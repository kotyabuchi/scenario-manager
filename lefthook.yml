pre-commit:
  jobs:
    - name: staged-ledger
      run: pnpm e2e:ledger:staged
      fail_text: "ステージ済み台帳のスキーマ・ID・参照検査に失敗しました"

    # lint・型・全体テストはquality:changedとCI plannerの共通ゲートで実行する。
    # hookはindex上の台帳だけを検査し、working treeをcommit内容の保証にしない。

    - name: agents-md-sync
      glob:
        - ".claude/rules/*.md"
        - ".claude/harness/agents-preamble.md"
        - "scripts/gen-agents-md.mjs"
      run: node scripts/gen-agents-md.mjs && git add AGENTS.md
      fail_text: "AGENTS.md の再生成に失敗しました"