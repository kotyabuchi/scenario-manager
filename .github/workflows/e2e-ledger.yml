name: E2E Ledger

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  static-ledger:
    name: Static Ledger Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare
      - run: pnpm test:e2e-tools
      - name: Check static ledger without database or browser execution
        run: pnpm e2e:ledger:check
        env:
          E2E_LEDGER_BOOTSTRAP_APPROVAL: ${{ vars.E2E_LEDGER_BOOTSTRAP_APPROVAL }}
