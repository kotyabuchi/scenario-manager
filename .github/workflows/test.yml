name: Test

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    name: Static and unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - &checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - &setup
        uses: ./.github/actions/setup
      - name: Check formatting and lint
        run: pnpm check:ci
      - name: Check types
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test:unit
      - name: Run legacy tool tests
        run: pnpm test:legacy-tools

  e2e:
    name: Local E2E (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - *checkout
      - *setup
      - uses: supabase/setup-cli@v3
        with:
          version: '2.75.0'
      - name: Verify native Supabase CLI
        run: |
          binary="$(command -v supabase)"
          test "$(head -c 4 "$binary" | od -An -tx1 | tr -d '[:space:]')" = 7f454c46
          test "$(supabase --version)" = 2.75.0
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run local E2E
        run: pnpm e2e:legacy

  aggregate:
    name: Local E2E verification
    if: ${{ always() }}
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every required job succeeded
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$E2E_RESULT" = success
