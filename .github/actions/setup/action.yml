name: Setup Node.js & pnpm
description: Install pinned pnpm and Node.js, dependencies, and PandaCSS output

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: '10.33.0'
    - uses: actions/setup-node@v4
      with:
        node-version: '24.12.0'
        cache: 'pnpm'
    # rootのprepare lifecycleでPandaCSSも生成する。
    - run: pnpm install --frozen-lockfile
      shell: bash
