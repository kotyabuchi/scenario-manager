<!DOCTYPE html>

<html lang="ja"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>セッション完了ダイアログ - シナプレ管理くん</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Icons -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
            extend: {
                colors: {
                    "primary": "#059568",
                    "background-light": "#f5f8f7",
                    "background-dark": "#0f231d",
                },
                fontFamily: {
                    "display": ["Noto Serif JP", "serif"],
                    "sans": ["Noto Serif JP", "serif"] // Forcing serif as per request context
                },
                borderRadius: {
                    "DEFAULT": "0.25rem", 
                    "lg": "0.5rem", 
                    "xl": "0.75rem", 
                    "2xl": "1rem", // 16px
                    "full": "9999px"
                },
                boxShadow: {
                    'soft': '0 8px 24px rgba(5, 149, 104, 0.08)',
                    'soft-dark': '0 8px 24px rgba(0, 0, 0, 0.4)',
                }
            },
            },
        }
    </script>
<style>
        /* Custom scrollbar for textareas */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent; 
        }
        textarea::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col items-center justify-center p-8 text-slate-800 dark:text-slate-100 bg-[url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&amp;w=2564&amp;auto=format&amp;fit=crop')] bg-cover bg-center bg-no-repeat bg-fixed backdrop-blur-sm" data-alt="Abstract soft green gradient background pattern">
<!-- Overlay backdrop simulation -->
<div class="fixed inset-0 bg-background-dark/40 backdrop-blur-[2px] z-0"></div>
<!-- Main Container for Demo Purposes: Arranging two dialogs side-by-side -->
<div class="relative z-10 w-full max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 items-start justify-center">
<!-- Dialog 1: Session Completion Confirmation -->
<div class="w-full max-w-[500px] bg-white dark:bg-[#1a2e28] rounded-2xl shadow-soft dark:shadow-soft-dark overflow-hidden mx-auto transition-all duration-300">
<!-- Header -->
<div class="px-8 py-6 border-b border-primary/10 flex justify-between items-center">
<h2 class="text-xl font-bold text-slate-900 dark:text-white tracking-wide">
                    セッションを完了にしますか？
                </h2>
<button class="text-slate-400 hover:text-primary transition-colors">
<span class="material-icons">close</span>
</button>
</div>
<!-- Body -->
<div class="p-8 space-y-6">
<!-- Summary Box -->
<div class="bg-background-light dark:bg-background-dark rounded-xl p-5 border border-primary/10 flex items-start gap-4">
<div class="h-16 w-16 rounded-lg bg-primary/10 flex-shrink-0 overflow-hidden relative group">
<!-- Placeholder for Scenario Image -->
<div class="absolute inset-0 bg-gradient-to-br from-primary/20 to-primary/5 flex items-center justify-center text-primary">
<span class="material-icons text-2xl">auto_stories</span>
</div>
</div>
<div>
<div class="text-xs font-medium text-primary uppercase tracking-wider mb-1">TRPG シナリオ</div>
<h3 class="font-bold text-lg leading-tight mb-1 text-slate-800 dark:text-white">深淵の森と失われた歌</h3>
<p class="text-sm text-slate-500 dark:text-slate-400 flex items-center gap-1">
<span class="material-icons text-sm">calendar_today</span> 2023年10月24日
                        </p>
</div>
</div>
<!-- Completion List -->
<div class="space-y-3">
<p class="text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">完了時の処理</p>
<label class="flex items-center gap-3 p-3 rounded-lg hover:bg-primary/5 transition-colors cursor-pointer group border border-transparent hover:border-primary/10">
<div class="relative flex items-center">
<input checked="" class="peer h-5 w-5 cursor-pointer appearance-none rounded border border-slate-300 checked:bg-primary checked:border-primary transition-all" type="checkbox"/>
<span class="material-icons absolute text-white opacity-0 peer-checked:opacity-100 pointer-events-none text-sm left-[3px]">check</span>
</div>
<span class="text-slate-600 dark:text-slate-300 group-hover:text-primary transition-colors">参加者のステータスを更新</span>
</label>
<label class="flex items-center gap-3 p-3 rounded-lg hover:bg-primary/5 transition-colors cursor-pointer group border border-transparent hover:border-primary/10">
<div class="relative flex items-center">
<input checked="" class="peer h-5 w-5 cursor-pointer appearance-none rounded border border-slate-300 checked:bg-primary checked:border-primary transition-all" type="checkbox"/>
<span class="material-icons absolute text-white opacity-0 peer-checked:opacity-100 pointer-events-none text-sm left-[3px]">check</span>
</div>
<span class="text-slate-600 dark:text-slate-300 group-hover:text-primary transition-colors">経験点の配布を実行</span>
</label>
<label class="flex items-center gap-3 p-3 rounded-lg hover:bg-primary/5 transition-colors cursor-pointer group border border-transparent hover:border-primary/10">
<div class="relative flex items-center">
<input checked="" class="peer h-5 w-5 cursor-pointer appearance-none rounded border border-slate-300 checked:bg-primary checked:border-primary transition-all" type="checkbox"/>
<span class="material-icons absolute text-white opacity-0 peer-checked:opacity-100 pointer-events-none text-sm left-[3px]">check</span>
</div>
<span class="text-slate-600 dark:text-slate-300 group-hover:text-primary transition-colors">セッションログをアーカイブ</span>
</label>
</div>
<!-- Note Textarea -->
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2" for="gm-notes">
                        GMメモ <span class="text-slate-400 font-normal ml-1">(任意・非公開)</span>
</label>
<textarea class="w-full rounded-xl border-slate-200 dark:border-slate-600 bg-white dark:bg-black/20 focus:border-primary focus:ring focus:ring-primary/20 transition-all resize-none text-slate-700 dark:text-slate-200 placeholder-slate-400 text-sm p-3" id="gm-notes" placeholder="セッションの感想や次回へのメモなどを記録できます..." rows="3"></textarea>
</div>
</div>
<!-- Footer Action Row -->
<div class="px-8 py-6 bg-background-light dark:bg-[#152621] border-t border-primary/10 flex justify-end gap-3">
<button class="px-5 py-2.5 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-white/5 font-medium transition-colors text-sm">
                    キャンセル
                </button>
<button class="px-6 py-2.5 rounded-lg bg-primary text-white font-medium hover:bg-[#04845c] active:bg-[#03724f] shadow-lg shadow-primary/20 transition-all flex items-center gap-2 text-sm">
<span class="material-icons text-sm">check_circle</span>
                    完了する
                </button>
</div>
</div>
<!-- Dialog 2: Review Promotion (Success State) -->
<div class="w-full max-w-[420px] bg-white dark:bg-[#1a2e28] rounded-2xl shadow-soft dark:shadow-soft-dark overflow-hidden mx-auto flex flex-col items-center text-center p-10 space-y-6 relative self-center lg:mt-20">
<!-- Decorative background elements -->
<div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-b from-primary/5 to-transparent"></div>
<!-- Success Icon -->
<div class="relative">
<div class="absolute inset-0 bg-primary/20 rounded-full blur-xl scale-150"></div>
<div class="h-20 w-20 bg-primary rounded-full flex items-center justify-center shadow-xl shadow-primary/30 relative z-10 animate-bounce-slight">
<span class="material-icons text-white text-5xl">done</span>
</div>
</div>
<!-- Content -->
<div class="space-y-3 relative z-10">
<h2 class="text-2xl font-bold text-slate-900 dark:text-white">セッションが完了しました</h2>
<p class="text-slate-500 dark:text-slate-400 leading-relaxed text-sm">
                    お疲れ様でした！<br/>
                    今回のセッション体験はいかがでしたか？<br/>
                    シナリオのレビューを書いて共有しましょう。
                </p>
</div>
<!-- Action Buttons -->
<div class="w-full space-y-3 pt-2 relative z-10">
<button class="w-full py-3.5 rounded-xl bg-primary text-white font-bold hover:bg-[#04845c] active:bg-[#03724f] shadow-lg shadow-primary/25 transition-all flex items-center justify-center gap-2 group">
<span class="material-icons text-white/90 group-hover:scale-110 transition-transform text-lg">rate_review</span>
                    レビューを書く
                </button>
<button class="w-full py-3 rounded-xl text-primary hover:bg-primary/5 font-medium transition-colors text-sm">
                    後で
                </button>
</div>
</div>
</div>
<!-- Instructions Overlay (Just for context, usually hidden in real app) -->
<div class="fixed bottom-4 left-0 w-full text-center pointer-events-none z-0 opacity-50">
<p class="text-xs text-white drop-shadow-md font-sans">Shinapre Kanri-kun UI Design • Soft UI Theme</p>
</div>
</body></html>
