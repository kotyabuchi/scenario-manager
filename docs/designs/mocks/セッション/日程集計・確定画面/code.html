<!DOCTYPE html>

<html lang="ja"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>日程集計・確定画面 - シナプレ管理くん</title>
<!-- Tailwind CSS -->

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#059568",
                        "primary-dark": "#047854",
                        "primary-light": "#E9FCF2",
                        "background-light": "#f5f8f7",
                        "background-dark": "#0f231d",
                        "surface-dark": "#1a3830",
                    },
                    fontFamily: {
                        "display": ["Noto Serif JP", "serif"],

                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},

        }

<style>
        /* Custom scrollbar for better aesthetic */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }
        
        /* Smooth transitions for collapsible elements */
        .collapsible-content {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .collapsible-content.open {
            max-height: 500px;
            opacity: 1;
        }
        
        /* Radio button hidden but functional */
        .date-selector:checked + div {
            background-color: #E9FCF2;
            border-left-color: #059568;
        }
